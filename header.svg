<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(360px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fall{animation:fall linear infinite}
.spin{animation:spin linear infinite}.spinr{animation:spinr linear infinite}
.glow{animation:glow 3s ease-in-out infinite}
.name{animation:rise 1.4s ease-out both}
@media (prefers-reduced-motion:reduce){.fall,.spin,.spinr,.glow,.name{animation:none}}
</style>
